<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0F5B3A" />
    <meta name="description" content="Plateforme du IT-CLUB EMSP : annonces, cellules, activités et ressources." />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
    <!-- Police chargée en display=swap : le texte s'affiche immédiatement -->
    <title>IT-CLUB EMSP — Ensemble, innovons, communiquons</title>
    <!-- Splash coloré : l'écran n'est jamais blanc pendant le chargement du JS -->
    <style>
      #root:empty {
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; background: linear-gradient(140deg, #0A1628, #0D1B2A 42%, #0F5B3A);
      }
      #root:empty::after {
        content: ""; width: 42px; height: 42px; border-radius: 50%;
        border: 3px solid rgba(154, 251, 215, .25); border-top-color: #1FAF72;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
