services:
  - type: web
    name: itclub-emsp-api
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    # Daphne (ASGI) : sert le HTTP (DRF) + le WebSocket (chat forum).
    # 1 seule instance sur le plan gratuit → InMemoryChannelLayer suffit.
    startCommand: daphne config.asgi:application --bind 0.0.0.0 --port $PORT
    envVars:
      # Daphne lit ce module (asgi.py ne fait que le défaut dev).
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings_prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: itclub-emsp-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://it-club-emsp.vercel.app
      - key: PYTHON_VERSION
        value: "3.11.16"
      # Base Neon (doc 09 §4) : coller l'URL poolée dans le dashboard Render
      # (Environment → DATABASE_URL, secret — jamais dans ce fichier).
      - key: DATABASE_URL
        sync: false
      # Connexion DIRECTE (sans "-pooler") : migrations du build.
      # Optionnelle mais recommandée — sinon migrate passe par le pooler.
      - key: NEON_DIRECT_URL
        sync: false
      - key: DB_CONN_MAX_AGE
        value: "0"
      # Emails Brevo (doc 09) : clé en secret Render, jamais ici.
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM
        value: onboarding@resend.dev
      - key: FRONTEND_URL
        value: https://it-club-emsp.vercel.app

  # Emails automatiques : rappels J-1/H-2h, satisfaction, récap dimanche.
  # 6h UTC = 6h à Abidjan (UTC+0 toute l'année).
  - type: cron
    name: itclub-emsp-emails
    runtime: python
    rootDir: backend
    schedule: "0 6 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py emails_periodiques --settings config.settings_prod
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.16"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM
        value: onboarding@resend.dev
      - key: FRONTEND_URL
        value: https://it-club-emsp.vercel.app
