services:
  - type: web
    name: itclub-emsp-api
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --chdir /opt/render/project/src/backend --bind 0.0.0.0:$PORT --workers 2 --settings config.settings_prod
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: itclub-emsp-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://it-club-emsp.vercel.app
      - key: PYTHON_VERSION
        value: "3.11.16"
      # Base Neon (doc 09 §4) : coller l'URL poolée dans le dashboard Render
      # (Environment → DATABASE_URL, secret — jamais dans ce fichier).
      - key: DATABASE_URL
        sync: false
      - key: DB_CONN_MAX_AGE
        value: "0"
      # Emails Resend (doc 09) : clé en secret Render, jamais ici.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: IT-CLUB EMSP <onboarding@resend.dev>
      - key: FRONTEND_URL
        value: https://it-club-emsp.vercel.app
